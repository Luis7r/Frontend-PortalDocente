<app-barraForm></app-barraForm>
<h1 class="text-center my-4">MATRÍCULA DE ESTUDIANTES</h1>

<div class="container">
  <div class="row">
    <!-- Formulario Apoderado -->
    <div class="col-md-6 mb-4">
      <form (ngSubmit)="addApoderado()">
        <h2 class="text-center mb-4">Datos del Apoderado</h2>
        <div class="card p-4">
          <div class="form-group mb-3">
            <label for="dni">N° de DNI</label>
            <input type="text" class="form-control" [(ngModel)]="newApoderado.dni" name="dni" placeholder="Ingrese su DNI">
          </div>
          <div class="form-group mb-3">
            <label for="nombres">Nombres</label>
            <input type="text" class="form-control" [(ngModel)]="newApoderado.nombre" name="nombre" placeholder="Ingrese sus nombres">
          </div>
          <div class="form-group mb-3">
            <label for="apellidos">Apellidos</label>
            <input type="text" class="form-control" [(ngModel)]="newApoderado.apellido" name="apellido" placeholder="Ingrese sus apellidos">
          </div>
          <div class="form-group mb-3">
            <label for="email">Correo Electrónico</label>
            <input type="email" class="form-control" [(ngModel)]="newApoderado.email" name="email" placeholder="Ingrese su correo electrónico">
          </div>
          <div class="form-group mb-3">
            <label for="celular">N° de Celular</label>
            <input type="tel" class="form-control" [(ngModel)]="newApoderado.celular" name="celular" placeholder="Ingrese su número de celular">
          </div>
          <div class="form-group mb-3">
            <label for="direccion">Dirección</label>
            <input type="text" class="form-control" [(ngModel)]="newApoderado.direccion" name="direccion" placeholder="Ingrese su dirección">
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-primary">Enviar</button>
          </div>
        </div>
      </form>
    </div>

    <!-- Formulario Estudiante -->
    <div class="col-md-6 mb-4">
      <form (ngSubmit)="addNewEstudiante()">
        <h2 class="text-center mb-4">Datos del Estudiante</h2>
        <div class="card p-4">
          <div class="form-group mb-3">
            <label for="dni">N° de DNI</label>
            <input type="text" class="form-control" [(ngModel)]="NewEstudiante.dni" name="dni" placeholder="Ingrese su DNI" required>
          </div>
          <div class="form-group mb-3">
            <label for="nombresEstudiante">Nombres</label>
            <input type="text" class="form-control" [(ngModel)]="NewEstudiante.nombre" name="nombre" placeholder="Ingrese sus nombres" required>
          </div>
          <div class="form-group mb-3">
            <label for="apellidosEstudiante">Apellidos</label>
            <input type="text" class="form-control" [(ngModel)]="NewEstudiante.apellido" name="apellido" placeholder="Ingrese sus apellidos" required>
          </div>
          <div class="form-group mb-3">
            <label for="grado">Grado</label>
            <select class="form-select" [(ngModel)]="selectedGrado" (change)="onGradoChange()" name="grado" required>
              <option value="" disabled selected>Seleccione un grado</option>
              <option value="1">1° secundaria</option>
              <option value="2">2° secundaria</option>
              <option value="3">3° secundaria</option>
              <option value="4">4° secundaria</option>
              <option value="5">5° secundaria</option>
            </select>
          </div>
          <div class="form-group mb-3">
            <label for="vacantes">Vacantes</label>
            <input type="text" class="form-control" placeholder="{{vacantes}}" readonly>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-primary">Enviar</button>
          </div>
        </div>
      </form>


    </div>
  </div>
</div>
