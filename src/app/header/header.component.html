<div class="sidebarr d-flex flex-column flex-shrink-0  shadow-sm" [class.open]="isSidebarOpen()">
      
      <!-- Botón de menú (Se usa para cerrar en móvil y como adorno en desktop) -->
      <div class="sidebar-header d-flex justify-content-center align-items-center">
        <button class="btn text-white" (click)="toggleSidebar()">
          <i class="bi bi-list" style="font-size: 38px;"></i>
        </button>
      </div>

      <!-- Menú de navegación -->
      <ul class="nav nav-pills flex-column mb-auto text-center w-100 p-0 m-0 mt-2">
        <li class="nav-item">
          <!-- Nota: En tu proyecto real cambia 'href="#"' por 'routerLink="/cursos"' y agrega 'routerLinkActive="active"' -->
          <a  routerLinkActive="active-link"  routerLink="/cursos" class="nav-link text-white d-flex flex-column justify-content-center align-items-center py-3" >
            <i class="bi bi-journal mb-1" style="font-size: 24px;"></i>
            <span class="sidebar-text">Cursos</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLinkActive="active-link" routerLink="/horarios" class="nav-link text-white d-flex flex-column justify-content-center align-items-center py-3">
            <i class="bi bi-calendar-event mb-1" style="font-size: 24px;"></i>
            <span class="sidebar-text">Horario</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLinkActive="active-link" routerLink="/ayuda" class="nav-link text-white d-flex flex-column justify-content-center align-items-center py-3">
            <i class="bi bi-question-circle mb-1" style="font-size: 24px;"></i>
            <span class="sidebar-text">Ayuda</span>
          </a>
        </li>
      </ul>

      <!-- Botón Salir (Fijado al fondo gracias a mt-auto) -->
      <div class="mt-auto w-100 pb-3">
        <hr class="text-secondary mx-3">
        <button class="btn text-white w-100 d-flex flex-column justify-content-center align-items-center logout-btn py-2" 
                data-bs-toggle="modal" data-bs-target="#salir" title="Salir">
          <i class="bi bi-box-arrow-in-right mb-1" style="font-size: 24px;"></i>
          <span class="sidebar-text">Salir</span>
        </button>
      </div>
    </div>


    <!-- ======================== -->
    <!-- COMPONENTE: NAVBAR HTML  -->
    <!-- ======================== -->
    <div class="main-content">
      <nav class="navbar navbar-expand-lg bg-white top-navbar shadow-sm px-3">
        <div class="container-fluid p-0 d-flex align-items-center">
          
          <!-- Botón de menú responsivo (Solo visible en móviles) -->
          <button class="btn d-md-none me-2 p-1 text-dark" (click)="toggleSidebar()">
            <i class="bi bi-list fs-1"></i>
          </button>

          <!-- Logo -->
          <a class="navbar-brand d-flex align-items-center m-0" routerLink="/cursos">
             <!-- Uso un placeholder para el demo, usa tu ruta original src="./imagenes/logoV.png" -->
            <img src="./imagenes/logoV.png" 
                 class="img-fluid logo-img" alt="Logo">
          </a>

          <!-- Espaciador flexible para empujar el perfil a la derecha -->
          <div class="flex-grow-1"></div>

          <!-- Perfil de Usuario -->
          <a class="text-decoration-none user-profile" routerLink="/perfil">
            <div class="d-flex align-items-center">
              <div class="text-end me-3 d-none d-sm-block">
                <div class="text-muted" style="font-size: 15px;">
                  Hola, <span class="text-dark fw-bold fs-6">{{ user?.nombre }} {{ user?.apellido }}</span>
                </div>
                <div class="text-secondary fw-semibold" style="font-size: 13px;">Docente</div>
              </div>
              <img src="https://class.utp.edu.pe/static/media/student.42525dea.svg" 
                   alt="Perfil" 
                   class="rounded-circle avatar-img">
            </div>
          </a>

        </div>
      </nav>


    <div class="modal fade" id="salir" tabindex="-1" aria-labelledby="salirLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold" id="salirLabel">¿Estás seguro que deseas salir?</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-secondary">
            Se cerrará la sesión actual de tu cuenta.
          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn btn-light fw-bold" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-danger fw-bold px-4" (click)="logout()">Salir</button>
          </div>
        </div>
      </div>
    </div>
