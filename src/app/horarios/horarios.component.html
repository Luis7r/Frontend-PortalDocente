<app-header></app-header>
<div style="padding-left: 100px;" class="container mt-4">
  <div *ngIf="horarios.length > 0">
    <h1 class=" text-center mb-4">Diciembre</h1>
    <!-- Calendario de Horarios -->
    <table class="table table-bordered table-striped table-hover table-responsive">
      <thead class="thead-light">
        <tr>
          <th class="text-center">Hora</th>
          <th *ngFor="let day of days" class="text-center">{{ day }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let hora of horas">
          <td class="text-center align-middle">{{ hora }}</td>
          <td *ngFor="let day of days" class="text-center align-middle">
            <div *ngFor="let horario of horariosPorHora[day]?.[hora]">
              <strong> {{ horario.ID_Curso }}° Sec.</strong><br>
              <small>{{ horario.HoraInicio }} - {{ horario.HoraFin }}</small>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="horarios.length === 0">
    <p class="text-center">No hay horarios disponibles para este profesor.</p>
  </div>

  <div *ngIf="errorMessage">
    <p class="text-center text-danger">{{ errorMessage }}</p>
  </div>
</div>
